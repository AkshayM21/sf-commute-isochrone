name: Production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  smoke:
    name: Public API and basemap contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run production smoke
        env:
          SFCI_SMOKE_BASE_URL: https://sfcommutemap.com
        run: python scripts/production_smoke.py --timeout 20
