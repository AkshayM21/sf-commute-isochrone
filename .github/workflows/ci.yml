name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/test_viz.mjs

  python:
    name: Data-free Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run bounded non-E2E tests
        run: >-
          python -m pytest -q
          tests/test_warm_numba.py
          tests/test_mc_stage_helpers.py
          tests/test_cache_memory_accounting.py
          tests/test_profile_trip_prune.py
          tests/test_planned_compact_trace.py
          tests/test_planned_trace.py
          tests/test_perf_benchmark.py
