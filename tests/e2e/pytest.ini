[pytest]
# E2E browser suite for the SF Commute Explorer (Playwright + pytest-playwright).
# Run from this directory so conftest.py is importable as a top-level module.
#   cd tests/e2e && ../../.venv/bin/python -m pytest
# or use ./run.sh from anywhere in the repo.
addopts = -v -ra --browser chromium --tb=short
testpaths = test_desktop.py test_mobile.py
# Show local variables on failure for clearer bug reports.
filterwarnings =
    ignore::DeprecationWarning
